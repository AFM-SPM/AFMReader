# Configuration
config:
  # MD013 - line-length
  line_length:
    line_length: 120
    code_blocks: false
    tables: false
  html:
    allowed_elements:
      - div

# Don't need to glob, the edited files are passed by pre-commit
# # Globs
# globs:
#   - "**/*.md"

# Fix any fixable errors
fix: true
